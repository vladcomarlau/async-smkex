<!DOCTYPE html>
<html>
<head>
<title>SMKEX Web Page</title>
<link href="/webjars/bootstrap/css/bootstrap.min.css" rel="stylesheet">
<script src="/webjars/jquery/jquery.min.js"></script>
<script src="/app.js"></script>
</head>
<body>
	<div id="main-content" class="container">
		<div class="row">
			<div class="col-md-6" style="background-color: #EEE">
				<form class="form-inline">
					<div class="form-group">
						<label for="username">WS Username</label> <input type="text"
							id="username" class="form-control"
							placeholder="Enter your username here...">
					</div>
				</form>

				<form class="form-inline">
					<div class="form-group">
						<label for="connect">WebSocket connection:</label>
						<button id="connect" class="btn btn-default" type="submit">Connect</button>
						<button id="disconnect" class="btn btn-default" type="submit"
							disabled="disabled">Disconnect</button>
					</div>
				</form>
			</div>

			<div class="row">
				<div class="col-md-6">
					<form class="form-inline">
						<div class="form-group">
							<label for="senderSerial">Sender</label> <input type="text"
								id="senderSerial" class="form-control"
								placeholder="Enter sender serial here...">
						</div>
					</form>
					<form class="form-inline">
						<div class="form-group">
							<label for="recipientSerial">Recipient</label> <input type="text"
								id="recipientSerial" class="form-control"
								placeholder="Enter your recipient serial here...">
						</div>
					</form>
					<form class="form-inline">
						<div class="form-group">
							<label for="message">Message Content</label> <input type="text"
								id="message" class="form-control"
								placeholder="Enter message here...">
						</div>
					</form>
					<button id="send" class="btn btn-default" type="button">Send</button>
				</div>
			</div>

		</div>

		<br> <br>
		<div class="row">
			<div class="col-md-12">
				<table id="conversation" class="table table-striped">
					<thead>
						<tr>
							<th>Messages</th>
						</tr>
					</thead>
					<tbody id="messages">
					</tbody>
				</table>
			</div>
		</div>

	</div>
</body>
</html>
